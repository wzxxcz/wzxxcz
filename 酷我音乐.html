<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <title>酷我音乐 - 音乐播放器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#a78bfa', 600: '#8b5cf6', 700: '#7c3aed' }
          },
          keyframes: {
            musicBar: {
              '0%, 100%': { transform: 'scaleY(0.4)' },
              '50%': { transform: 'scaleY(1.2)' },
            },
            heartBeat: {
              '0%, 100%': { transform: 'scale(1)' },
              '25%': { transform: 'scale(1.2)' },
              '50%': { transform: 'scale(0.9)' },
              '75%': { transform: 'scale(1.1)' }
            }
          },
          animation: {
            musicBar: 'musicBar 0.8s ease-in-out infinite',
            heartBeat: 'heartBeat 0.3s ease-in-out'
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html, body { height: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden; }
    body { -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }

    /* 🌟 挖孔屏/刘海屏安全区适配 */
    header.glass-strong { margin-top: calc(env(safe-area-inset-top, 0px) + 8px); }
    #lyricOverlay .lyr-head { padding-top: calc(env(safe-area-inset-top, 0px) + 34px) !important; }
    #sideDrawer > .absolute { padding-top: calc(env(safe-area-inset-top, 0px) + 16px) !important; }
    
    /* 🌟 全屏动态背景图片 */
    #bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      object-fit: cover;
      z-index: -200;
      filter: brightness(0.6) saturate(1.1);
      transition: filter 0.5s ease;
    }

    /* 🌟 统一磨砂玻璃基础类 (Dark Mode) - 透明度与搜索框完全一致 (0.08) */
    .glass, .glass-strong, .glass-input {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass {
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(167, 139, 250, 0.6);
      box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
    }

    /* 🌟 统一浅色模式磨砂玻璃 - 透明度与搜索框完全一致 (0.5) */
    html.light .glass, html.light .glass-strong, html.light .glass-input {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #0f172a;
    }
    html.light .glass {
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }
    html.light .glass-input::placeholder { color: #64748b; }
    html.light .glass-input:focus {
      background: rgba(255, 255, 255, 0.7);
      border-color: #8b5cf6;
    }

    @keyframes lyricFadeIn { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
    .animate-lyric { animation: lyricFadeIn 0.25s ease-out forwards; }
    
    .music-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
      width: 16px;
    }
    .music-bar {
      width: 3px;
      background: linear-gradient(to top, #a78bfa, #c4b5fd);
      border-radius: 2px;
      animation: musicBar 0.8s ease-in-out infinite;
      transform-origin: bottom;
    }
    .music-bar:nth-child(1) { animation-delay: 0s; }
    .music-bar:nth-child(2) { animation-delay: 0.15s; }
    .music-bar:nth-child(3) { animation-delay: 0.3s; }
    .music-bar:nth-child(4) { animation-delay: 0.45s; }

    /* 收藏按钮样式 */
    .favorite-btn {
      transition: all 0.3s ease;
    }
    .favorite-btn.liked {
      color: #ef4444;
    }
    .favorite-btn.liked svg {
      animation: heartBeat 0.3s ease-in-out;
    }

    /* 播放控制按钮样式 */
    .control-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08); /* 统一透明度 */
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    .control-btn svg {
      width: 20px;
      height: 20px;
    }

    * { transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease; }

    /* 🌟 榜单快捷栏样式 */
    .rank-tab { transition: all 0.2s ease; flex-shrink: 0; cursor: pointer; }
    .rank-tab:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .rank-tab.rank-active { background: rgba(167,139,250,0.3); border-color: rgba(167,139,250,0.7); color: #fff; font-weight: 600; }

    /* 🌟 三行迷你歌词样式 */
    .mini-lrc { max-width: 100%; text-align: center; line-height: 1.3; transition: all 0.3s ease; cursor: pointer; }
    .mini-lrc:hover { color: rgba(255,255,255,0.85); }
    .lrc-dim { font-size: 10px; color: rgba(255,255,255,0.35); font-weight: 400; }
    .lrc-cur { font-size: 13px; color: #fff; font-weight: 800; letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(167,139,250,0.7);
      background: rgba(167,139,250,0.18);
      border: 1px solid rgba(167,139,250,0.35);
      border-radius: 8px; padding: 1px 8px; line-height: 1.4;
      box-shadow: 0 0 14px rgba(167,139,250,0.25); }

    /* 🌟 歌词聚焦面板（点击迷你歌词展开，拉高覆盖，其他内容下沉） */
    #lyricOverlay {
      position: fixed; inset: 0; z-index: 60;
      background: linear-gradient(180deg, rgba(20, 14, 36, 0.72), rgba(16, 11, 30, 0.68));
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
    }
    #lyricOverlay.show { opacity: 1; pointer-events: auto; }
    #lyricOverlay .lyr-head {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      padding: 40px 16px 14px; }
    #lyricOverlay .lyr-head .lft {
      display: flex; flex-direction: column; gap: 6px; align-items: center;
      background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.22);
      border-radius: 18px; padding: 14px 22px 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.28);
    }
    #lyricOverlay .ol-cover {
      width: 62px; height: 62px; border-radius: 14px;
      object-fit: cover; flex-shrink: 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    #lyricOverlay .lyr-head .t {
      font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.5px;
      font-family: "PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
      text-shadow: 0 1px 8px rgba(167,139,250,0.6); }
    #lyricOverlay .lyr-head .a {
      font-size: 12px; color: rgba(216,199,255,0.92); font-weight: 500;
      letter-spacing: 0.5px; font-family: "PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4); }
    #lyricOverlay .lyr-body {
      flex: 1; overflow: hidden; text-align: center; position: relative; }
    /* KTV固定高亮框：永远钉在可视区正中间，歌词垂直上移去匹配它 */
    #lyricOverlay .lyr-ketbar {
      position: absolute; left: 2%; right: 2%; top: 50%;
      height: 56px; transform: translateY(-50%); pointer-events: none;
      border-radius: 16px; z-index: 1;
      background: rgba(167,139,250,0.14);
      box-shadow: 0 0 0 1px rgba(167,139,250,0.32) inset, 0 0 30px rgba(139,92,246,0.22);
    }
    /* 歌词轨道：垂直伸缩平移，让当前行对准中间高亮框 */
    #lyricOverlay .lyr-track {
      padding: 46% 0; will-change: transform;
    }
    #lyricOverlay .lyr-line {
      height: 56px; line-height: 56px;
      font-family: "PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
      font-size: 16px; font-weight: 550; color: rgba(255,255,255,0.42);
      cursor: pointer; white-space: nowrap; overflow: hidden;
      letter-spacing: 1px;
      transition: color 0.15s ease, font-size 0.15s ease;
    }
    /* 当前播放句：落入固定框的整句高亮（圆润亮白，无边框无布局偏移） */
    #lyricOverlay .lyr-line.on {
      font-family: "PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
      font-size: 20px; font-weight: 700; color: #fff;
      letter-spacing: 1.5px;
      text-shadow: 0 0 22px rgba(167,139,250,0.95), 0 2px 10px rgba(0,0,0,0.5);
    }
    #lyricOverlay .fast {
      flex-shrink: 0; display: flex; justify-content: center; gap: 12px;
      padding: 6px 16px calc(16px + env(safe-area-inset-bottom,0px)); }
    #lyricOverlay .fast button {
      background: linear-gradient(135deg, rgba(167,139,250,0.30), rgba(139,92,246,0.16));
      border: 1px solid rgba(196,178,255,0.35);
      color: #fff; font-size: 12.5px; font-weight: 600;
      padding: 10px 24px; border-radius: 999px; cursor: pointer;
      font-family: "PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: all 0.2s ease; }
    #lyricOverlay .fast button:hover { background: linear-gradient(135deg, rgba(167,139,250,0.45), rgba(139,92,246,0.26)); }
    #lyricOverlay .fast button:active { transform: scale(0.94); }
  </style>
</head>
<body class="text-slate-100 flex flex-col font-sans select-none antialiased bg-slate-950">

  <!-- 🌟 全屏动态背景图片（外链，不依赖本地文件） -->
  <img id="bg-image" src="https://picsum.photos/seed/kuwo/1080/1920" alt="背景">

  <!-- 导航栏 (统一磨砂透明度) -->
  <header class="shrink-0 glass-strong px-3 py-2.5 mx-2 mt-2 rounded-2xl flex items-center justify-between relative z-40">
    <!-- 菜单按钮 -->
    <button id="menuBtn" class="p-1.5 text-white/70 hover:text-white rounded-full hover:bg-white/10 transition cursor-pointer" title="菜单">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    
    <!-- 动态视频头像 + 标题居中 -->
    <div class="flex flex-col items-center flex-1">
      <div class="relative w-12 h-12 rounded-full overflow-hidden border-2 border-brand-500/80 shrink-0 mb-1 shadow-lg shadow-brand-500/20">
        <video src="avatar.mp4" autoplay loop muted playsinline class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"></video>
        <div class="hidden absolute inset-0 bg-brand-600 items-center justify-center text-white text-xl font-bold">K</div>
      </div>
      <h1 class="text-xl md:text-2xl font-black tracking-wider bg-gradient-to-r from-brand-500 to-purple-300 bg-clip-text text-transparent text-center drop-shadow-sm">酷我音乐网</h1>
    </div>

    <div class="flex items-center space-x-1 w-8 justify-end">
      <button id="themeToggle" class="p-1.5 text-white/70 hover:text-white rounded-full hover:bg-white/10 transition cursor-pointer" title="切换主题">
        <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path id="sunPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          <path id="moonPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="hidden" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
      <button id="settingsBtn" class="p-1.5 text-white/70 hover:text-white rounded-full hover:bg-white/10 transition cursor-pointer" title="设置">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>
    </div>
  </header>

  <!-- 侧边栏抽屉 -->
  <div id="sideDrawer" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50">
    <div class="absolute left-0 top-0 h-full w-72 glass-strong p-6 overflow-y-auto">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-xl font-bold text-white">菜单</h2>
        <button id="closeDrawer" class="text-white/60 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <nav class="space-y-3">
        <button onclick="showRecentPlayed()" class="w-full text-left px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition flex items-center space-x-3">
          <svg class="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>最近播放</span>
        </button>
        <button onclick="showFavorites()" class="w-full text-left px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition flex items-center space-x-3">
          <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span>我的收藏</span>
        </button>
      </nav>
      <div id="drawerContent" class="mt-6 space-y-2"></div>
    </div>
  </div>

  <!-- 主容器 -->
  <main class="flex-1 min-h-0 flex flex-col md:flex-row p-2 pb-0 gap-2 overflow-hidden relative z-10">
    <div class="flex-1 min-h-0 flex flex-col gap-2">
      <!-- 搜索栏 -->
      <div class="flex space-x-2 w-full shrink-0">
        <input id="searchInput" type="text" placeholder="搜歌曲、歌手..." class="flex-1 min-w-0 glass-input rounded-xl px-3 py-2.5 text-sm focus:outline-none text-white transition placeholder:text-white/50">
        <button id="searchBtn" class="bg-brand-600/90 hover:bg-brand-600 active:scale-95 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition shrink-0 whitespace-nowrap shadow-lg shadow-brand-600/20 backdrop-blur-md border border-white/10">搜索</button>
      </div>

      <!-- 榜单快捷栏 -->
      <div id="rankBar" class="flex w-full shrink-0 gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <button data-rank="飙升榜" class="rank-tab shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🔥 飙升榜</button>
        <button data-rank="热歌榜" class="rank-tab rank-active shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🎶 热歌榜</button>
        <button data-rank="新歌榜" class="rank-tab shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🆕 新歌榜</button>
        <button data-rank="DJ榜" class="rank-tab shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🎧 DJ榜</button>
        <button data-rank="国语榜" class="rank-tab shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🇨🇳 国语榜</button>
        <button data-rank="欧美榜" class="rank-tab shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🌍 欧美榜</button>
        <button data-rank="韩语榜" class="rank-tab shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🇰🇷 韩语榜</button>
        <button data-rank="日语榜" class="rank-tab shrink-0 text-[11px] px-3 py-1.5 rounded-lg glass-input text-white/60 hover:text-white transition whitespace-nowrap">🇯🇵 日语榜</button>
      </div>
      
      <!-- 歌曲列表 (统一磨砂透明度) -->
      <div class="glass rounded-xl flex-1 min-h-0 flex flex-col overflow-hidden">
        <div class="px-3.5 py-2 border-b border-white/10 flex justify-between items-center shrink-0">
          <span class="font-bold text-xs text-white/80">歌曲列表</span>
          <span id="pageIndicator" class="text-[10px] text-white/50">第 1 页</span>
        </div>
        <div id="musicList" class="flex-1 overflow-y-auto no-scrollbar divide-y divide-white/5">
          <div class="text-center text-white/50 py-12 text-sm">输入歌曲名开始搜索吧 ✨</div>
        </div>
        <div id="pagination" class="hidden px-3 py-2 border-t border-white/10 flex justify-between shrink-0">
          <button id="prevPageBtn" class="text-[11px] px-2.5 py-1 glass-input rounded-lg hover:bg-white/10 transition text-white/80">上一页</button>
          <button id="nextPageBtn" class="text-[11px] px-2.5 py-1 glass-input rounded-lg hover:bg-white/10 transition text-white/80">下一页</button>
        </div>
      </div>
    </div>

    <!-- 歌词面板 (桌面端显示 + 统一磨砂透明度) -->
    <div class="hidden md:flex flex-[0.8] min-h-0 flex flex-col glass rounded-xl overflow-hidden">
      <div class="px-3.5 py-2 border-b border-white/10 flex justify-between items-center shrink-0">
        <span class="font-bold text-xs text-white/80">歌词同步</span>
        <button id="downloadLrcBtn" class="hidden text-[10px] text-brand-400 hover:text-brand-300 flex items-center space-x-1 bg-brand-500/20 hover:bg-brand-500/30 px-2 py-0.5 rounded transition border border-brand-500/30">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          <span>LRC</span>
        </button>
      </div>
      <div id="lyricsContainer" class="relative flex-1 overflow-y-auto no-scrollbar py-16 px-4 space-y-3 scroll-smooth">
        <div class="text-center text-white/40 py-8 text-sm">暂无正在播放的歌词</div>
      </div>
    </div>
  </main>

  <!-- 歌词聚焦面板 -->
  <div id="lyricOverlay">
    <div class="lyr-head">
      <div class="lft">
        <img id="olCover" src="" alt="" class="ol-cover">
        <div class="t" id="olTitle">歌词</div>
        <div class="a" id="olArtist"></div>
      </div>
    </div>

  <script>
    // ========== 工具函数 ==========
    function decodeHTML(html) {
      if (!html) return '';
      const txt = document.createElement("textarea");
      txt.innerHTML = html;
      return txt.value;
    }
    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }
    function artworkShort2Long(albumpicShort) {
      if (!albumpicShort) return undefined;
      const idx = albumpicShort.indexOf("/");
      return idx !== -1 ? `https://img1.kuwo.cn/star/albumcover/1080${albumpicShort.slice(idx)}` : undefined;
    }
    function getDefaultCover() {
      const canvas = document.createElement('canvas');
      canvas.width = 100; canvas.height = 100;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 100, 100);
      grad.addColorStop(0, '#8b5cf6'); grad.addColorStop(1, '#6d28d9');
      ctx.fillStyle = grad; ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, 0, 100, 100, 12);
      else ctx.rect(0, 0, 100, 100);
      ctx.fill(); ctx.fillStyle = 'white'; ctx.font = '48px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🎵', 50, 52);
      return canvas.toDataURL('image/png');
    }
    const DEFAULT_COVER = getDefaultCover();
    // 封面加载兜底：img4 失败自动轮换 img1/img2/img3，全部失败回退默认封面
    function setupCover(img, url) {
      const hosts = ['img1', 'img2', 'img3', 'img4'];
      const base = url || '';
      if (!img) return;
      img.onerror = function() {
        let cur = (this.getAttribute('data-src') || base);
        const m = cur.match(/^https?:\/\/([^.]+)\.kuwo\.cn\//);
        if (m) {
          const idx = hosts.indexOf(m[1]);
          if (idx >= 0 && idx < hosts.length - 1) {
            const next = cur.replace(m[1], hosts[idx + 1]);
            this.setAttribute('data-src', next);
            this.src = next;
            return;
          }
        }
        this.onerror = null;
        this.src = DEFAULT_COVER;
      };
      img.setAttribute('data-src', base);
      img.src = base || DEFAULT_COVER;
    }
    // 全局内联兜底（供动态列表封面 onerror 调用）：轮换 img1-4，全失败回退默认
    function coverFallback(el) {
      const url = el.getAttribute('data-src') || '';
      const m = url.match(/^https?:\/\/([^.]+)\.kuwo\.cn\//);
      if (m) {
        const hosts = ['img1', 'img2', 'img3', 'img4'];
        const idx = hosts.indexOf(m[1]);
        if (idx >= 0 && idx < hosts.length - 1) {
          const next = url.replace(m[1], hosts[idx + 1]);
          el.setAttribute('data-src', next);
          el.src = next;
          return;
        }
      }
      el.onerror = null;
      el.src = DEFAULT_COVER;
    }
    // 生成带兜底的封面 img 标签（用于 innerHTML 动态渲染）
    function coverTag(url, cls) {
      const src = url || DEFAULT_COVER;
      return `<img src="${src}" data-src="${src}" class="${cls}" onerror="coverFallback(this)">`;
    }
    function getProxyUrl(url) {
      const proxyBase = localStorage.getItem('music_cors_proxy') || 'https://jsnzkpg4.pages.dev/';
      const cleanProxy = proxyBase.endsWith('/') ? proxyBase : proxyBase + '/';
      return `${cleanProxy}${url}`;
    }

    // ========== DOM ==========
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const musicList = document.getElementById('musicList');
    const pageIndicator = document.getElementById('pageIndicator');
    const pagination = document.getElementById('pagination');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const playerCover = document.getElementById('playerCover');
    const olCover = document.getElementById('olCover');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');
    const qualitySelect = document.getElementById('qualitySelect');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const miniLyricPrev = document.getElementById('miniLyricPrev');
    const miniLyricCur = document.getElementById('miniLyricCur');
    const miniLyricNext = document.getElementById('miniLyricNext');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const proxyInput = document.getElementById('proxyInput');
    const saveProxyBtn = document.getElementById('saveProxyBtn');
    const downloadSongBtn = document.getElementById('downloadSongBtn');
    const downloadLrcBtn = document.getElementById('downloadLrcBtn');
    const themeToggle = document.getElementById('themeToggle');
    const sunPath = document.getElementById('sunPath');
    const moonPath = document.getElementById('moonPath');
    const footerMusicBars = document.getElementById('footerMusicBars');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const favoriteBtn = document.getElementById('favoriteBtn');
    const favoriteIcon = document.getElementById('favoriteIcon');
    const menuBtn = document.getElementById('menuBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const closeDrawer = document.getElementById('closeDrawer');
    const drawerContent = document.getElementById('drawerContent');
    const homeBtn = document.getElementById('homeBtn');

    // ========== 状态 ==========
    let currentQuery = '';
    let currentPage = 1;
    let playlist = [];
    let currentIndex = -1;
    let lyrics = [];
    let lastActiveIdx = -1;
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    let recentPlayed = JSON.parse(localStorage.getItem('recentPlayed') || '[]');
    let isLoading = false;
    let currentRank = '热歌榜';   // 当前激活的榜单

    // ========== 随机打乱 ==========
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ========== 主题切换 ==========
    function setTheme(isDark) {
      const html = document.documentElement;
      if (isDark) {
        html.classList.add('dark'); html.classList.remove('light');
        sunPath.classList.remove('hidden'); moonPath.classList.add('hidden');
      } else {
        html.classList.remove('dark'); html.classList.add('light');
        sunPath.classList.add('hidden'); moonPath.classList.remove('hidden');
      }
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    function toggleTheme() { setTheme(!document.documentElement.classList.contains('dark')); }
    themeToggle.onclick = toggleTheme;
    function initTheme() { setTheme(localStorage.getItem('theme') !== 'light'); }

    // ========== API ==========
    async function searchMusic(query, page) {
      const url = `http://search.kuwo.cn/r.s?client=kt&all=${encodeURIComponent(query)}&pn=${page - 1}&rn=30&uid=2574109560&ver=kwplayer_ar_8.5.4.2&vipver=1&ft=music&cluster=0&strategy=2012&encoding=utf8&rformat=json&vermerge=1&mobi=1`;
      const response = await fetch(getProxyUrl(url));
      let text = await response.text();
      if (text.startsWith('callback(') || text.startsWith('jsonp(')) {
        text = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
      }
      let res;
      try { res = JSON.parse(text); } catch(e) { res = eval('(' + text + ')'); }
      const songs = res.abslist.map(_ => ({
        id: _.MUSICRID.replace("MUSIC_", ""),
        artwork: artworkShort2Long(_.web_albumpic_short),
        title: decodeHTML(_.NAME || ""),
        artist: decodeHTML(_.ARTIST || ""),
        album: decodeHTML(_.ALBUM || ""),
      }));
      return { isEnd: (+res.PN + 1) * +res.RN >= +res.TOTAL, data: songs };
    }

    const _lyricCache = {};
    async function fetchLyrics(songId) {
      if (_lyricCache[songId] !== undefined) return _lyricCache[songId];
      // 实测：m.kuwo.cn 歌词接口仅支持 http 协议，且需正确的音乐ID；https 或错误路径必失败
      const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${encodeURIComponent(songId)}&httpStatus=1`;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 8000);
          const response = await fetch(getProxyUrl(url), { signal: ctrl.signal });
          clearTimeout(timer);
          const res = await response.json();
          const rawList = res.data?.lrclist;
          if (Array.isArray(rawList) && rawList.length > 0) {
            const out = rawList.map(line => {
              let time = 0;
              if (typeof line.time === 'string' && line.time.includes(':')) {
                const p = line.time.split(':');
                if (p.length === 2) time = parseInt(p[0]) * 60 + parseFloat(p[1]);
              } else { time = parseFloat(line.time) || 0; }
              return { time: time, text: decodeHTML(line.lineLyric || '') };
            }).filter(it => it.text);
            if (out.length) return _lyricCache[songId] = out;
          } else if (typeof res.data?.lrc === 'string' && res.data.lrc.includes('[')) {
            return _lyricCache[songId] = parseLrcText(res.data.lrc);
          }
        } catch(e) {}
      }
      return _lyricCache[songId] = [];
    }
    // 解析 LRC 纯文本歌词 -> [{time, text}]
    function parseLrcText(lrc) {
      const out = [];
      const lineRe = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
      lrc.split('\n').forEach(ln => {
        let m, base = lineRe.lastIndex = 0, times = [];
        while ((m = lineRe.exec(ln)) !== null) times.push(parseInt(m[1]) * 60 + parseFloat(m[2]) + (m[3] ? parseFloat('0.' + m[3]) : 0));
        if (!times.length) return;
        const text = ln.replace(lineRe, '').trim();
        if (!text) return;
        times.forEach(t => out.push({ time: t, text: decodeHTML(text) }));
      });
      return out.sort((a, b) => a.time - b.time);
    }

    async function fetchHighResArtwork(songId) {
      const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${songId}&httpStatus=1`;
      try {
        const response = await fetch(getProxyUrl(url));
        const res = await response.json();
        const originalUrl = res.data?.songinfo?.pic;
        if (originalUrl) {
          const secureUrl = originalUrl.replace(/^http:/i, "https:");
          if (secureUrl.includes("starheads/")) return secureUrl.replace(/starheads\/\d+/, "starheads/800");
          if (secureUrl.includes("albumcover/")) return secureUrl.replace(/albumcover\/\d+/, "albumcover/800");
          return secureUrl;
        }
        return null;
      } catch(e) { return null; }
    }

    // ========== 渲染 ==========
    async function triggerSearch() {
      const query = searchInput.value.trim();
      if (!query) return;
      currentQuery = query; currentPage = 1;
      await loadSearchList();
    }

    async function loadSearchList() {
      if (isLoading) return;
      isLoading = true;
      
      try {
        musicList.innerHTML = '<div class="text-center text-white/50 py-12 text-xs"> 正在搜寻...</div>';
        const result = await searchMusic(currentQuery, currentPage);
        playlist = result.data;
        if (playlist.length === 0) {
          musicList.innerHTML = '<div class="text-center text-white/50 py-12 text-xs">没有找到相关音乐 😭</div>';
          pagination.classList.add('hidden'); return;
        }
        // 榜单模式：加载后随机打乱顺序
        if (currentQuery === currentRank) {
          shuffle(playlist);
        }
        renderPlaylist();
        pageIndicator.innerText = currentQuery === currentRank
          ? `🎲 ${currentRank} · 已随机 · 第 ${currentPage} 页`
          : `第 ${currentPage} 页`;
        pagination.classList.remove('hidden');
        prevPageBtn.disabled = currentPage === 1;
        prevPageBtn.className = currentPage === 1 ? "text-[11px] px-2.5 py-1 glass-input text-white/30 rounded-lg cursor-not-allowed" : "text-[11px] px-2.5 py-1 glass-input text-white/80 rounded-lg hover:bg-white/10 transition";
      } catch(err) {
        console.error('搜索失败:', err);
        musicList.innerHTML = `<div class="text-center text-red-400 py-8 px-4 text-xs">搜索歌曲，一起来听歌吧 </div>`;
      } finally {
        isLoading = false;
      }
    }

    function renderPlaylist() {
      musicList.innerHTML = playlist.map((song, idx) => {
        const isActive = currentIndex === idx;
        const isFav = favorites.some(f => f.id === song.id);
        const rightContent = isActive 
          ? `<div class="music-bars shrink-0 ml-2"><div class="music-bar"></div><div class="music-bar"></div><div class="music-bar"></div><div class="music-bar"></div></div>`
          : `<span class="text-[10px] text-white/40 shrink-0 ml-2">点击播放</span>`;
        
        return `
          <div data-index="${idx}" class="flex items-center justify-between p-2.5 cursor-pointer transition ${isActive ? 'bg-brand-600/20 border-l-4 border-brand-500' : 'hover:bg-white/5'}">
            <div class="flex items-center space-x-2.5 min-w-0 flex-1">
              ${coverTag(song.artwork, 'w-8 h-8 rounded object-cover bg-white/10 border border-white/10 shrink-0')}
              <div class="min-w-0 flex-1">
                <p class="text-xs font-semibold truncate ${isActive ? 'text-brand-300' : 'text-white/90'}">${song.title}</p>
                <p class="text-[10px] text-white/50 truncate">${song.artist} - ${song.album || '未知专辑'}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <button class="favorite-btn ${isFav ? 'liked' : ''} p-1.5" onclick="event.stopPropagation(); toggleFavoriteByIndex(${idx})" title="收藏">
                <svg class="w-4 h-4" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
              </button>
              ${rightContent}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderLyrics() {
      if (!lyricsContainer) return;
      if (!lyrics || lyrics.length === 0) {
        lyricsContainer.innerHTML = '<div class="text-center text-white/40 py-8 text-xs">暂无歌词</div>';
        return;
      }
      lyricsContainer.innerHTML = lyrics.map((line, idx) => `
        <div id="lyric-line-${idx}" data-time="${line.time}" class="lyric-line py-1 px-1.5 text-center text-xs md:text-sm text-white/50 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded">
          ${line.text}
        </div>
      `).join('');
    }

// 🌟 三行迷你歌词渲染：中间高亮聚焦，上下淡出，点击任一行跳转聚焦
    function renderMiniLrc(activeIdx) {
      if (!lyrics || lyrics.length === 0) {
        miniLyricPrev.innerText = ''; miniLyricPrev.dataset.idx = '';
        miniLyricCur.innerText = '🎵 酷我音乐，听我想听'; miniLyricCur.dataset.idx = '';
        miniLyricNext.innerText = ''; miniLyricNext.dataset.idx = '';
        return;
      }
      const i = Math.max(0, Math.min(activeIdx, lyrics.length - 1));
      miniLyricPrev.innerText = i > 0 ? lyrics[i-1].text : '';
      miniLyricPrev.dataset.idx = i > 0 ? (i-1) : '';
      miniLyricCur.innerText = lyrics[i].text || '...';
      miniLyricCur.dataset.idx = i;
      miniLyricNext.innerText = i < lyrics.length-1 ? lyrics[i+1].text : '';
      miniLyricNext.dataset.idx = i < lyrics.length-1 ? (i+1) : '';
    }

    // 🌟 迷你歌词点击聚焦：跳到对应歌词时间点
    function focusLine(idxStr) {
      const idx = parseInt(idxStr, 10);
      if (isNaN(idx) || !lyrics || !lyrics[idx]) return;
      audioPlayer.currentTime = lyrics[idx].time;
      audioPlayer.play();
      if (lyricsContainer) {
        const el = document.getElementById('lyric-line-' + idx);
        if (el) {
          document.querySelectorAll('.lyric-line').forEach((ele, ix) => {
            if (ix === idx) {
              ele.className = 'lyric-line py-2 px-1.5 text-center text-sm md:text-base text-brand-300 font-extrabold transition-all duration-300 transform scale-105 drop-shadow-md';
              lyricsContainer.scrollTo({ top: ele.offsetTop - lyricsContainer.clientHeight/2 + ele.clientHeight/2, behavior: 'smooth' });
            } else {
              ele.className = 'lyric-line py-1 px-1.5 text-center text-xs md:text-sm text-white/50 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded';
            }
          });
        }
      }
    }

    // ========== 歌词聚焦面板 ==========
    function openLyricOverlay() {
      const o = document.getElementById('lyricOverlay');
      if (currentIndex === -1) { document.getElementById('olBody').innerHTML = '<div style="padding:40px;color:rgba(255,255,255,0.4)">请先播放一首歌曲</div>'; }
      o.classList.add('show');
      renderOverlay();
      startLrcRAF();
    }
    function closeLyricOverlay() {
      stopLrcRAF();
      document.getElementById('lyricOverlay').classList.remove('show');
    }
    function renderOverlay() {
      const body = document.getElementById('olBody');
      const song = playlist[currentIndex] || {};
      document.getElementById('olTitle').textContent = song.title || '歌词';
      document.getElementById('olArtist').textContent = (song.artist || '') + (song.album ? ' · ' + song.album : '');
      setupCover(document.getElementById('olCover'), song.artwork);
      body.innerHTML = !lyrics || lyrics.length === 0
        ? '<div style="padding:40px;color:rgba(255,255,255,0.4)">暂无歌词</div>'
        : `<div class="lyr-ketbar"></div><div class="lyr-track">${lyrics.map((ln, i) => `<div class="lyr-line" data-i="${i}" data-t="${ln.time}">${ln.text}</div>`).join('')}</div>`;
      syncLastIdx = -1; curY = 0; targetY = 0;
    }
    // KTV模式：高亮框固定居中，歌词一行一行向上平移去匹配固定框
    let syncLastIdx = -1;
    let curY = 0, targetY = 0;
    function syncOverlay() {
      const body = document.getElementById('olBody');
      if (!body || !lyrics || lyrics.length === 0) return;
      const track = body.querySelector('.lyr-track');
      if (!track) return;
      const t = audioPlayer.currentTime;
      let idx = 0;
      for (let i = 0; i < lyrics.length; i++) { if (t >= lyrics[i].time) idx = i; else break; }
      if (idx !== syncLastIdx) {
        syncLastIdx = idx;
        track.querySelectorAll('.lyr-line').forEach(el => {
          el.classList.toggle('on', parseInt(el.getAttribute('data-i'), 10) === idx);
        });
        const line = track.querySelector('.lyr-line.on');
        if (line) targetY = body.clientHeight / 2 - (line.offsetTop + line.offsetHeight / 2);
      }
      // 线性插值：歌词平滑上移到位
      curY += (targetY - curY) * 0.15;
      if (Math.abs(targetY - curY) < 0.5) curY = targetY;
      track.style.transform = `translateY(${curY}px)`;
    }
    // rAF 高频驱动整句高亮（60fps，瞬间切换不滞后）
    let lrcRAF = null;
    function startLrcRAF() {
      cancelAnimationFrame(lrcRAF);
      const tick = () => {
        if (!document.getElementById('lyricOverlay').classList.contains('show')) return;
        syncOverlay();
        lrcRAF = requestAnimationFrame(tick);
      };
      lrcRAF = requestAnimationFrame(tick);
    }
    function stopLrcRAF() { cancelAnimationFrame(lrcRAF); lrcRAF = null; }
    // 点击正文歌词跳转
    function onLyricOverlayClick(e) {
      const line = e.target.closest('.lyr-line');
      if (line) audioPlayer.currentTime = parseFloat(line.getAttribute('data-t')) || 0;
    }
    // 上句/下句
    function fastLrc(dir) {
      if (!lyrics || lyrics.length === 0) return;
      const cur = lyrics.reduce((acc, ln, i) => (ln.time <= audioPlayer.currentTime + 0.05 ? i : acc), -1);
      let next = Math.max(0, Math.min(cur + dir, lyrics.length - 1));
      audioPlayer.currentTime = lyrics[next].time;
      audioPlayer.play();
      syncLastIdx = -1;
      syncOverlay();
    }

    // ========== 播放 ==========
    async function playSong(idx) {
      if (idx < 0 || idx >= playlist.length) return;
      currentIndex = idx;
      const song = playlist[currentIndex];
      renderPlaylist();

      playerTitle.innerText = song.title;
      playerArtist.innerText = song.artist;
      setupCover(playerCover, song.artwork);

      addToRecent(song);

      const QUALITY_MAP = { '128k': 'standard', '320k': 'exhigh', 'flac': 'lossless' };
      const apiLevel = QUALITY_MAP[qualitySelect.value] || 'standard';
      const playUrl = `https://music.nxinxz.com/kw.php?id=${encodeURIComponent(song.id)}&level=${apiLevel}&type=mp3`;
      audioPlayer.src = playUrl;
      audioPlayer.play().catch(err => console.log('等待用户交互', err));
      updatePlayButtonState(true);
      updateMediaSession(song);

      fetchHighResArtwork(song.id).then(url => { if(url) { song.artwork = url; setupCover(playerCover, url); if (olCover) setupCover(olCover, url); } });

      lastActiveIdx = -1;
      miniLyricPrev.innerText = ''; miniLyricCur.innerText = '⏳ 正在加载歌词...'; miniLyricNext.innerText = '';
      lyricsContainer.innerHTML = '<div class="text-center text-white/40 py-8 text-xs">正在加载歌词...</div>';
      downloadLrcBtn.classList.add('hidden');
      lyrics = [];

      const rawLyrics = await fetchLyrics(song.id);
      if (rawLyrics && rawLyrics.length > 0) {
        lyrics = rawLyrics;
        renderLyrics();
        if (document.getElementById('lyricOverlay').classList.contains('show')) { renderOverlay(); syncLastIdx = -1; syncOverlay(); }
        downloadLrcBtn.classList.remove('hidden');
        miniLyricPrev.innerText = song.title; miniLyricCur.innerText = song.artist; miniLyricNext.innerText = '';
      } else {
        lyricsContainer.innerHTML = '<div class="text-center text-white/40 py-8 text-xs">暂无歌词</div>';
        miniLyricPrev.innerText = ''; miniLyricCur.innerText = '🔇 暂无歌词'; miniLyricNext.innerText = '';
      }
      
      updateFavoriteButton();
    }

    function updatePlayButtonState(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = `<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />`;
        footerMusicBars.classList.remove('hidden');
      } else {
        playIcon.innerHTML = `<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />`;
        footerMusicBars.classList.add('hidden');
      }
    }

    // ========== 收藏功能 ==========
    function isFavorite(song) {
      return favorites.some(f => f.id === song.id);
    }

    function toggleFavorite() {
      if (currentIndex === -1) return;
      const song = playlist[currentIndex];
      toggleFavoriteSong(song);
    }

    function toggleFavoriteByIndex(idx) {
      const song = playlist[idx];
      toggleFavoriteSong(song);
    }

    function toggleFavoriteSong(song) {
      const index = favorites.findIndex(f => f.id === song.id);
      if (index > -1) {
        favorites.splice(index, 1);
      } else {
        favorites.push(song);
      }
      localStorage.setItem('favorites', JSON.stringify(favorites));
      renderPlaylist();
      updateFavoriteButton();
    }

    function updateFavoriteButton() {
      if (currentIndex === -1) return;
      const song = playlist[currentIndex];
      const liked = isFavorite(song);
      if (liked) {
        favoriteBtn.classList.add('liked');
        favoriteIcon.setAttribute('fill', 'currentColor');
      } else {
        favoriteBtn.classList.remove('liked');
        favoriteIcon.setAttribute('fill', 'none');
      }
    }

    // ========== 最近播放 ==========
    function addToRecent(song) {
      const index = recentPlayed.findIndex(r => r.id === song.id);
      if (index > -1) {
        recentPlayed.splice(index, 1);
      }
      recentPlayed.unshift(song);
      if (recentPlayed.length > 20) recentPlayed.pop();
      localStorage.setItem('recentPlayed', JSON.stringify(recentPlayed));
    }

    // ========== 侧边栏菜单 ==========
    function openDrawer() {
      sideDrawer.classList.remove('hidden');
    }

    function closeDrawerFunc() {
      sideDrawer.classList.add('hidden');
    }

    function showRecentPlayed() {
      if (recentPlayed.length === 0) {
        drawerContent.innerHTML = '<div class="text-center text-white/50 py-8 text-sm">暂无最近播放</div>';
      } else {
        drawerContent.innerHTML = '<h3 class="font-bold text-white mb-4 px-2">最近播放</h3>' +
          recentPlayed.map((song, idx) => `
            <div class="flex items-center space-x-3 p-3 rounded-lg bg-white/5 hover:bg-white/10 cursor-pointer transition" onclick="playFromRecent(${idx})">
              ${coverTag(song.artwork, 'w-10 h-10 rounded object-cover')}
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-white truncate">${song.title}</p>
                <p class="text-xs text-white/50 truncate">${song.artist}</p>
              </div>
            </div>
          `).join('');
      }
      openDrawer();
    }

    function showFavorites() {
      if (favorites.length === 0) {
        drawerContent.innerHTML = '<div class="text-center text-white/50 py-8 text-sm">暂无收藏歌曲</div>';
      } else {
        drawerContent.innerHTML = '<h3 class="font-bold text-white mb-4 px-2">我的收藏</h3>' +
          favorites.map((song, idx) => `
            <div class="flex items-center space-x-3 p-3 rounded-lg bg-white/5 hover:bg-white/10 cursor-pointer transition" onclick="playFromFavorite(${idx})">
              ${coverTag(song.artwork, 'w-10 h-10 rounded object-cover')}
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-white truncate">${song.title}</p>
                <p class="text-xs text-white/50 truncate">${song.artist}</p>
              </div>
            </div>
          `).join('');
      }
      openDrawer();
    }

    function playFromRecent(idx) {
      const song = recentPlayed[idx];
      playlist = [...recentPlayed]; // 复制数组，避免引用问题
      currentIndex = idx;
      playSong(idx);
      closeDrawerFunc();
    }

    function playFromFavorite(idx) {
      const song = favorites[idx];
      playlist = [...favorites]; // 复制数组，避免引用问题
      currentIndex = idx;
      playSong(idx);
      closeDrawerFunc();
    }

    // ========== 返回首页功能 ==========
    function goHome() {
      // 关闭侧边栏（如果打开）
      closeDrawerFunc();
      // 关闭设置弹窗（如果打开）
      settingsModal.classList.add('hidden');
      // 回到热歌榜榜单首页
      searchInput.value = currentRank;
      document.querySelectorAll('.rank-tab').forEach(b => b.classList.remove('rank-active'));
      const hotBtn = document.querySelector('.rank-tab[data-rank="热歌榜"]');
      if (hotBtn) hotBtn.classList.add('rank-active');
      currentPage = 1;
      loadSearchList();
    }

    // 🌟 迷你歌词条点击 → 展开全屏歌词聚焦面板（其他板块下沉）
    miniLyricPrev.addEventListener('click', openLyricOverlay);
    miniLyricCur.addEventListener('click', openLyricOverlay);
    miniLyricNext.addEventListener('click', openLyricOverlay);

    // ========== 下载 ==========
    async function downloadCurrentSong() {
      if (currentIndex === -1) { alert('请先播放一首歌曲'); return; }
      const song = playlist[currentIndex];
      const QUALITY_MAP = { '128k': 'standard', '320k': 'exhigh', 'flac': 'lossless' };
      const apiLevel = QUALITY_MAP[qualitySelect.value] || 'standard';
      const playUrl = `https://music.nxinxz.com/kw.php?id=${encodeURIComponent(song.id)}&level=${apiLevel}&type=mp3`;
      const originalHTML = downloadSongBtn.innerHTML;
      downloadSongBtn.innerHTML = `<span class="animate-pulse"></span> 下载中...`;
      downloadSongBtn.disabled = true;
      try {
        const response = await fetch(getProxyUrl(playUrl));
        const blob = await response.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${song.title} - ${song.artist}.${apiLevel === 'lossless' ? 'flac' : 'mp3'}`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch(e) { alert('下载失败'); }
      downloadSongBtn.innerHTML = originalHTML;
      downloadSongBtn.disabled = false;
    }

    function downloadLyrics() {
      if (lyrics.length === 0) { alert('没有歌词可下载'); return; }
      const song = playlist[currentIndex];
      let lrc = `[ti:${song.title}]\n[ar:${song.artist}]\n[al:${song.album || '未知'}]\n`;
      lyrics.forEach(line => {
        const m = Math.floor(line.time / 60).toString().padStart(2, '0');
        const s = Math.floor(line.time % 60).toString().padStart(2, '0');
        const ms = Math.floor((line.time % 1) * 100).toString().padStart(2, '0');
        lrc += `[${m}:${s}.${ms}]${line.text}\n`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([lrc], { type: 'text/plain;charset=utf-8' }));
      a.download = `${song.title} - ${song.artist}.lrc`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ========== 音频事件 ==========
    audioPlayer.ontimeupdate = () => {
      const cur = audioPlayer.currentTime;
      const dur = audioPlayer.duration || 0;
      progressBar.style.width = `${(cur/dur)*100 || 0}%`;
      currentTimeEl.innerText = formatTime(cur);
      durationTimeEl.innerText = formatTime(dur);

      if (lyrics.length > 0) {
        let activeIdx = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (cur >= lyrics[i].time) activeIdx = i;
          else break;
        }
        if (activeIdx === -1) activeIdx = 0;
        if (activeIdx !== lastActiveIdx) {
          lastActiveIdx = activeIdx;
          renderMiniLrc(activeIdx);
          // 歌词聚焦面板：切换句后主动点亮（rAF 另每帧同步，此处仅重置节流）
          if (document.getElementById('lyricOverlay').classList.contains('show')) {
            syncLastIdx = -1;
            syncOverlay();
          }
          if (lyricsContainer) {
            document.querySelectorAll('.lyric-line').forEach((el, idx) => {
              if (idx === activeIdx) {
                el.className = 'lyric-line py-2 px-1.5 text-center text-sm md:text-base text-brand-300 font-extrabold transition-all duration-300 transform scale-105 drop-shadow-md';
                const containerHeight = lyricsContainer.clientHeight;
                const lineOffsetTop = el.offsetTop;
                const lineHeight = el.clientHeight;
                lyricsContainer.scrollTo({ top: lineOffsetTop - containerHeight/2 + lineHeight/2, behavior: 'smooth' });
              } else {
                el.className = 'lyric-line py-1 px-1.5 text-center text-xs md:text-sm text-white/50 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded';
              }
            });
          }
        }
      }
    };

    audioPlayer.onended = () => {
      if (playlist.length) {
        if (currentIndex < playlist.length - 1) playSong(currentIndex + 1);
        else playSong(0);
      }
    };

    // ========== 事件绑定 ==========
    searchBtn.onclick = triggerSearch;
    searchInput.onkeypress = e => { if(e.key === 'Enter') triggerSearch(); };
    musicList.addEventListener('click', e => {
      const row = e.target.closest('[data-index]');
      if (row) playSong(parseInt(row.dataset.index, 10));
    });
    prevPageBtn.onclick = async () => { if(currentPage > 1) { currentPage--; await loadSearchList(); } };
    nextPageBtn.onclick = async () => { currentPage++; await loadSearchList(); };
    playBtn.onclick = () => {
      if (audioPlayer.src) {
        if (audioPlayer.paused) { audioPlayer.play(); updatePlayButtonState(true); }
        else { audioPlayer.pause(); updatePlayButtonState(false); }
      }
    };
    prevBtn.onclick = () => { 
      if(playlist.length) {
        const newIndex = currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
        playSong(newIndex);
      }
    };
    nextBtn.onclick = () => { 
      if(playlist.length) {
        const newIndex = currentIndex < playlist.length - 1 ? currentIndex + 1 : 0;
        playSong(newIndex);
      }
    };
    progressContainer.onclick = e => {
      if (!audioPlayer.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
    };
    lyricsContainer.onclick = e => {
      const line = e.target.closest('.lyric-line');
      if (line) { const t = parseFloat(line.dataset.time); if(!isNaN(t)) audioPlayer.currentTime = t; }
    };
    qualitySelect.onchange = () => { if(currentIndex !== -1) { const t = audioPlayer.currentTime; playSong(currentIndex).then(() => audioPlayer.currentTime = t); } };
    downloadSongBtn.onclick = downloadCurrentSong;
    downloadLrcBtn.onclick = downloadLyrics;
    favoriteBtn.onclick = toggleFavorite;
    // 🏠 返回首页按钮事件
    homeBtn.onclick = goHome;

    // 🏆 榜单按钮事件
    document.querySelectorAll('.rank-tab').forEach(btn => {
      btn.onclick = () => {
        const rankName = btn.getAttribute('data-rank');
        currentRank = rankName;
        // 高亮当前榜单
        document.querySelectorAll('.rank-tab').forEach(b => b.classList.remove('rank-active'));
        btn.classList.add('rank-active');
        // 搜索该榜单并随机
        searchInput.value = rankName;
        triggerSearch();
      };
    });

    settingsBtn.onclick = () => { proxyInput.value = localStorage.getItem('music_cors_proxy') || 'https://jsnzkpg4.pages.dev/'; settingsModal.classList.remove('hidden'); };
    closeSettingsBtn.onclick = () => settingsModal.classList.add('hidden');
    saveProxyBtn.onclick = () => {
      const v = proxyInput.value.trim();
      if (v) localStorage.setItem('music_cors_proxy', v);
      else localStorage.removeItem('music_cors_proxy');
      settingsModal.classList.add('hidden');
      window.location.reload();
    };

    menuBtn.onclick = openDrawer;
    closeDrawer.onclick = closeDrawerFunc;
    sideDrawer.onclick = (e) => { if(e.target === sideDrawer) closeDrawerFunc(); };

    // 🌟 核心修复：完美接管浏览器返回手势，防止退出应用或触发500错误
    window.addEventListener('DOMContentLoaded', () => {
      // 1. 初始化时，强制在历史记录中推入一个"首页"标记
      window.history.pushState({ view: 'home' }, '', window.location.href);
      
      // 2. 默认加载「热歌榜」榜单首页 + 随机
      searchInput.value = currentRank;
      currentPage = 1;
      loadSearchList();
    });

    window.addEventListener('popstate', function(event) {
      // 如果后退导致 state 丢失，或者明确回到了 home 状态
      // 说明用户试图从首页退出，或从抽屉状态返回
      if (!event.state || event.state.view === 'home') {
        // 立即重新推入 home 状态，阻止浏览器真正的后退/退出行为
        window.history.pushState({ view: 'home' }, '', window.location.href);
        
        // 如果此时侧边栏是打开的，优先关闭侧边栏（提供顺滑的"返回"体验）
        if (!sideDrawer.classList.contains('hidden')) {
          closeDrawerFunc();
        }
        // 如果侧边栏已经关闭，则什么都不做，用户会感觉"返回手势被禁用，稳稳留在首页"
      }
    });

    // ========== 后台播放能力 (Media Session + 前台自动续播) ==========
    let wasPlayingOnBlur = false;
    // 更新锁屏/通知栏媒体信息
    function updateMediaSession(song) {
      if (!('mediaSession' in navigator)) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title || '',
          artist: song.artist || '',
          album: song.album || '酷我音乐',
          artwork: [{ src: song.artwork || DEFAULT_COVER, sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', () => { audioPlayer.play(); updatePlayButtonState(true); });
        navigator.mediaSession.setActionHandler('pause', () => { audioPlayer.pause(); updatePlayButtonState(false); });
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          if (currentIndex > 0) playSong(currentIndex - 1);
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          if (playlist.length) playSong((currentIndex + 1) % playlist.length);
        });
        try { navigator.mediaSession.setActionHandler('seekto', (d) => { if (d.seekTime != null) audioPlayer.currentTime = d.seekTime; }); } catch(e){}
      } catch(e) {}
    }
    // 切后台不主动断；切回前台时若切后台前在播放且被系统暂停则自动续播
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        wasPlayingOnBlur = !audioPlayer.paused;
      } else {
        if (wasPlayingOnBlur && audioPlayer.paused && audioPlayer.src) {
          audioPlayer.play().catch(() => {});
          updatePlayButtonState(true);
        }
        wasPlayingOnBlur = false;
      }
    });
    // 监听系统媒体控制（锁屏/耳机手势）也同步播放状态
    if (audioPlayer) {
      audioPlayer.addEventListener('play', () => updatePlayButtonState(true));
      audioPlayer.addEventListener('pause', () => updatePlayButtonState(false));
    }

    console.log('🎵 酷我音乐网 (统一磨砂透明度 + 返回首页按钮版) 已加载');
  </script>
</body>
</html>
